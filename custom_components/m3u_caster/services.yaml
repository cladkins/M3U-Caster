play_stream:
  name: Play stream
  description: Cast a channel by stream ID to a media player.
  fields:
    stream_id:
      name: Stream ID
      required: true
      selector:
        text:
    media_player:
      name: Media player
      required: true
      selector:
        entity:
          domain: media_player
    cast_type:
      name: Cast type
      description: Auto detect uses the media player's integration. Apple TV app launches a player app by URL scheme (VLC by default).
      default: auto
      selector:
        select:
          options:
            - label: Auto detect
              value: auto
            - label: Roku
              value: roku
            - label: Apple TV (AirPlay)
              value: apple_tv
            - label: Apple TV app (VLC)
              value: apple_tv_app
            - label: Chromecast
              value: cast
            - label: Generic
              value: generic
    app_link:
      name: App link template
      description: For Apple TV app. {url} is replaced with the encoded stream URL. Default is VLC.
      required: false
      example: "vlc-x-callback://x-callback-url/stream?url={url}"
      selector:
        text:
    auto_confirm:
      name: Auto confirm
      description: For apple_tv_app. Press Select on the tvOS "Open in app?" prompt.
      default: true
      selector:
        boolean:
stop:
  name: Stop
  description: Stop playback. Presses Select then Home on Apple TV app targets, Home on Roku, media_stop elsewhere.
  fields:
    media_player:
      name: Media player
      required: true
      selector:
        entity:
          domain: media_player
    cast_type:
      name: Cast type
      default: auto
      selector:
        select:
          options:
            - label: Auto detect
              value: auto
            - label: Roku
              value: roku
            - label: Apple TV (AirPlay)
              value: apple_tv
            - label: Apple TV app (VLC)
              value: apple_tv_app
            - label: Chromecast
              value: cast
            - label: Generic
              value: generic
            - label: Home button only
              value: home
sync_playlist:
  name: Sync playlist
  description: Re-sync a playlist on your IPTV panel. Requires an API token.
  fields:
    playlist_uuid:
      name: Playlist UUID
      required: false
      selector:
        text:
refresh:
  name: Refresh
  description: Re-poll channels and EPG now.
play_multiview:
  name: Play multiview
  description: Send up to four channels to a QuadStream private stream set, then relaunch QuadStream on an Apple TV. Requires the QuadStream username and secret in the integration options.
  fields:
    stream_ids:
      name: Stream IDs
      description: One to four stream IDs, in quadrant order. An empty entry skips that slot.
      required: true
      selector:
        text:
          multiple: true
    media_player:
      name: Apple TV
      description: Media player to relaunch QuadStream on. Leave empty to only update the stream set.
      required: false
      selector:
        entity:
          domain: media_player
